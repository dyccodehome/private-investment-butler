tools:
  portfolio_snapshot:
    description: 读取 Cash_Anchor 本地持仓、投入计划和分红能力快照。
    risk_level: low
    access_type: local_read
    allowed_frameworks:
      - Cash_Anchor
    allowed_agents:
      - worker
    requires_human_approval: false
    timeout_seconds: 10
    audit_level: full
    output_schema: SkillPayload
    data_type: portfolio_snapshot

  research_dossier:
    description: 读取或准备策略岛内的个股研究档案。
    risk_level: low
    access_type: local_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - auditor
    requires_human_approval: false
    timeout_seconds: 10
    audit_level: full
    output_schema: SkillPayload
    data_type: research_dossier

  market-data:
    description: 通过统一市场数据 Provider 获取只读行情事实。
    risk_level: low
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - auditor
    requires_human_approval: false
    timeout_seconds: 20
    audit_level: full
    output_schema: SkillPayload
    data_type: market_data

  trade_history:
    description: 从本地会话黑匣子和研究档案检索历史判断。
    risk_level: low
    access_type: local_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - auditor
    requires_human_approval: false
    timeout_seconds: 10
    audit_level: full
    output_schema: SkillPayload
    data_type: trade_history

  news-search:
    description: 调用财经新闻搜索 Provider 获取外部只读资讯。
    risk_level: low
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - auditor
    requires_human_approval: false
    timeout_seconds: 20
    audit_level: full
    output_schema: SkillPayload
    data_type: news

  announcement-search:
    description: 调用公司公告搜索 Provider 获取财报、利润分配和权益分派公告。
    risk_level: low
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - auditor
    requires_human_approval: false
    timeout_seconds: 20
    audit_level: full
    output_schema: SkillPayload
    data_type: announcement

  longbridge_positions:
    description: 读取长桥持仓和自选股并生成只读同步提案；固定现金流标的归 Cash Anchor，其余美股持仓/自选归 Growth Engine 美股上下文。
    risk_level: medium
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - command
      - scheduler
    allowed_commands:
      - longbridge positions --format json
      - longbridge watchlist --format json
    requires_human_approval: false
    timeout_seconds: 15
    audit_level: full
    output_schema: LongbridgeSyncProposal
    data_type: broker_position_sync

  longbridge_us_income_distributions:
    description: 读取长桥资金流水和历史分红记录，生成美元收益分配同步结果。
    risk_level: medium
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
    allowed_agents:
      - command
      - scheduler
    allowed_commands:
      - longbridge cash-flow --start <YYYY-MM-DD> --end <YYYY-MM-DD> --format json
      - longbridge dividend <symbol> --format json
    requires_human_approval: false
    timeout_seconds: 15
    audit_level: full
    output_schema: LongbridgeUSIncomeDistributionSync
    data_type: broker_income_sync

  longbridge_exchange_rate:
    description: 读取长桥当前汇率，用于跨币种组合收益率合并计算。
    risk_level: low
    access_type: external_read
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - worker
      - command
      - scheduler
    allowed_commands:
      - longbridge exchange-rate --format json
    requires_human_approval: false
    timeout_seconds: 15
    audit_level: full
    output_schema: LongbridgeExchangeRates
    data_type: currency_exchange_rate

  accept_patch_proposal:
    description: 将人工确认后的宪法补丁写入目标 constitution 文件。
    risk_level: high
    access_type: rule_write
    allowed_frameworks:
      - Cash_Anchor
      - Growth_Engine
    allowed_agents:
      - human_callback
    requires_human_approval: true
    timeout_seconds: 20
    audit_level: full
    output_schema: PatchArchiveResult
    data_type: rule_change
