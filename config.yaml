openai:
  provider: openai
  api_protocol: responses
  # Do not put the real key here. Set this environment variable instead.
  api_key_env: OPENAI_API_KEY
  base_url: https://api.openai.com
  responses_path: /v1/responses
  chat_completions_path: /v1/chat/completions
  default_model: gpt-5.5
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 60

deepseek:
  provider: deepseek
  api_protocol: chat_completions
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  responses_path: /v1/responses
  chat_completions_path: /v1/chat/completions
  default_model: deepseek-v4-pro
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 180

gemini:
  provider: gemini
  api_protocol: gemini_generate_content
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com
  responses_path: /v1beta/models/{model}:generateContent
  chat_completions_path: /v1/chat/completions
  default_model: gemini-2.5-pro
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 60

router:
  max_route_retries: 3

frameworks:
  Cash_Anchor:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: medium
    max_output_tokens: 4096
    allowed_skills:
      - portfolio_snapshot
      - hithink-market-query
      - position_snapshot
      - research_dossier
      - trade_history
      - news-search
      - announcement-search
  Growth_Engine:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 4096
    allowed_skills:
      - hithink-market-query
      - position_snapshot
      - research_dossier
      - trade_history
      - news-search

agents:
  auditor:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 1600
  knowledge_absorber:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 2400

messaging:
  provider: feishu
  app_id_env: FEISHU_APP_ID
  app_secret_env: FEISHU_APP_SECRET
  lark_host: https://open.feishu.cn
  verification_token_env: FEISHU_VERIFICATION_TOKEN
  encrypt_key_env: FEISHU_ENCRYPT_KEY

yuque:
  token_env: YUQUE_TOKEN
  namespace_env: YUQUE_NAMESPACE
  archive_dir_env: YUQUE_ARCHIVE_DIR

iwencai:
  api_key_env: IWENCAI_API_KEY
  api_url_env: IWENCAI_API_URL

scheduler:
  enabled: true
  timezone: Asia/Shanghai
  dry_run_by_default: false
  skip_weekends_for_daily: true
  skip_holidays: true
  holidays:
    CN: []
    US: []
  jobs:
    growth_cn_daily_review:
      enabled: true
      type: growth_daily_review
      market: CN
      schedule: daily
      time: "16:30"
    cash_anchor_cn_dividend_review:
      enabled: true
      type: cash_anchor_cn_dividend_review
      market: CN
      schedule: daily
      time: "18:30"
    cash_anchor_us_income_distribution_sync:
      enabled: true
      type: cash_anchor_us_income_distribution_sync
      market: US
      schedule: daily
      time: "07:15"
    growth_us_daily_review:
      enabled: true
      type: growth_daily_review
      market: US
      schedule: daily
      time: "06:00"
    growth_weekly_review:
      enabled: true
      type: growth_weekly_review
      market: ALL
      schedule: weekly
      weekday: sunday
      time: "20:00"

token_monitor:
  enabled: true
  daily_total_token_limit: 300000
  per_session_token_limit: 50000
  warning_threshold: 0.8

budgets:
  default:
    max_tokens: 12000
    warn_tokens: 9000
  workflows:
    natural_language_pipeline:
      max_tokens: 20000
      warn_tokens: 15000
    growth_daily_review:
      max_tokens: 30000
      warn_tokens: 24000
    cash_anchor_cn_dividend_review:
      max_tokens: 12000
      warn_tokens: 9000
    cash_anchor_us_income_distribution_sync:
      max_tokens: 8000
      warn_tokens: 6000
    knowledge_absorb:
      max_tokens: 40000
      warn_tokens: 32000
    absorb_discussion:
      max_tokens: 25000
      warn_tokens: 20000

cost_management:
  currency: USD
  daily_budget_usd: 5.0
  warning_threshold: 0.8
  model_prices:
    openai:
      gpt-5.5:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
    deepseek:
      deepseek-v4-pro:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
    gemini:
      gemini-2.5-pro:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
