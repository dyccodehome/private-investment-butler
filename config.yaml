openai:
  provider: openai
  api_protocol: responses
  # Do not put the real key here. Set this environment variable instead.
  api_key_env: OPENAI_API_KEY
  base_url: https://api.openai.com
  responses_path: /v1/responses
  chat_completions_path: /v1/chat/completions
  default_model: gpt-5.5
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 60

deepseek:
  provider: deepseek
  api_protocol: chat_completions
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  responses_path: /v1/responses
  chat_completions_path: /v1/chat/completions
  default_model: deepseek-v4-pro
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 180

gemini:
  provider: gemini
  api_protocol: gemini_generate_content
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com
  responses_path: /v1beta/models/{model}:generateContent
  chat_completions_path: /v1/chat/completions
  default_model: gemini-2.5-pro
  default_reasoning_effort: medium
  default_max_output_tokens: 4096
  timeout_seconds: 60

router:
  max_route_retries: 3

frameworks:
  Cash_Anchor:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: medium
    max_output_tokens: 4096
    allowed_skills:
      - portfolio_snapshot
      - market-data
      - research_dossier
      - trade_history
      - news-search
      - announcement-search
  Growth_Engine:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 4096
    allowed_skills:
      - market-data
      - research_dossier
      - trade_history
      - news-search
      - announcement-search

agents:
  auditor:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 1600
  knowledge_absorber:
    provider: deepseek
    model: deepseek-v4-pro
    reasoning_effort: high
    max_output_tokens: 2400

growth_universe:
  cache_enabled: true
  cache_ttl_seconds: 900
  leveraged_etf_blocklist: "CONL,FNGD,FNGU,LABD,LABU,MSTU,MSTX,MSTZ,NVDL,NVDQ,NVDU,SOXL,SOXS,SPXL,SPXS,SQQQ,SVIX,TECL,TECS,TQQQ,TSLL,TSLQ,UPRO,UVIX"
  leveraged_etf_allowlist: ""
  ordinary_etf_allowlist: "DRAM,SPCX"
  special_etf_classifications: "DRAM:memory_semiconductor_etf:普通主题 ETF，聚焦存储与半导体周期，不属于杠杆 ETF;SPCX:spac_new_issue_etf:普通主题 ETF，聚焦 SPAC 与新上市公司，不属于杠杆 ETF"

messaging:
  provider: feishu
  app_id_env: FEISHU_APP_ID
  app_secret_env: FEISHU_APP_SECRET
  lark_host: https://open.feishu.cn
  verification_token_env: FEISHU_VERIFICATION_TOKEN
  encrypt_key_env: FEISHU_ENCRYPT_KEY

yuque:
  token_env: YUQUE_TOKEN
  namespace_env: YUQUE_NAMESPACE
  archive_dir_env: YUQUE_ARCHIVE_DIR

scheduler:
  enabled: true
  timezone: Asia/Shanghai
  dry_run_by_default: false
  skip_weekends_for_daily: true
  skip_holidays: true
  use_trading_calendar: true
  holidays:
    CN: []
    US: []
  jobs:
    cash_anchor_cn_premarket_review:
      enabled: true
      type: cash_anchor_cn_premarket_review
      market: CN
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "08:50"
    cash_anchor_cn_close_review:
      enabled: true
      type: cash_anchor_cn_close_review
      market: CN
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "16:20"
    cash_anchor_us_premarket_review:
      enabled: true
      type: cash_anchor_us_premarket_review
      market: US
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "08:30"
      time_timezone: America/New_York
    growth_us_premarket_review:
      enabled: true
      type: growth_us_premarket_review
      market: US
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "08:40"
      time_timezone: America/New_York
    cash_anchor_us_close_review:
      enabled: true
      type: cash_anchor_us_close_review
      market: US
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "17:10"
      time_timezone: America/New_York
    growth_us_close_review:
      enabled: true
      type: growth_us_close_review
      market: US
      schedule: daily
      weekdays: [monday, tuesday, wednesday, thursday, friday]
      time: "17:20"
      time_timezone: America/New_York
    cash_anchor_weekly_review:
      enabled: true
      type: cash_anchor_weekly_review
      market: ALL
      schedule: weekly
      weekday: sunday
      time: "20:00"
    growth_weekly_review:
      enabled: true
      type: growth_weekly_review
      market: ALL
      schedule: weekly
      weekday: sunday
      time: "20:10"

token_monitor:
  enabled: true
  daily_total_token_limit: 300000
  per_session_token_limit: 50000
  warning_threshold: 0.8

budgets:
  default:
    max_tokens: 12000
    warn_tokens: 9000
  workflows:
    natural_language_pipeline:
      max_tokens: 20000
      warn_tokens: 15000
    growth_daily_review:
      max_tokens: 30000
      warn_tokens: 24000
    scheduled_review:
      max_tokens: 40000
      warn_tokens: 32000
    cash_anchor_cn_dividend_review:
      max_tokens: 12000
      warn_tokens: 9000
    cash_anchor_us_income_distribution_sync:
      max_tokens: 8000
      warn_tokens: 6000
    knowledge_absorb:
      max_tokens: 40000
      warn_tokens: 32000
    absorb_discussion:
      max_tokens: 25000
      warn_tokens: 20000

cost_management:
  currency: USD
  daily_budget_usd: 5.0
  warning_threshold: 0.8
  model_prices:
    openai:
      gpt-5.5:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
    deepseek:
      deepseek-v4-pro:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
    gemini:
      gemini-2.5-pro:
        input_per_1m: 0
        output_per_1m: 0
        reasoning_per_1m: 0
